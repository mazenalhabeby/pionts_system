<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pionts — Documentation</title>
  <meta name="description" content="Integration docs for the Pionts loyalty & rewards platform. SDK, API reference, platform guides.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --base-font-size: 15px;
      --base-line-height: 1.7;
      --base-color: #1e293b;
      --base-background-color: #ffffff;
      --sidebar-width: 280px;
      --sidebar-background: #f8fafc;
      --sidebar-border-color: #e2e8f0;
      --sidebar-nav-link-color--active: #6366f1;
      --sidebar-nav-link-font-weight--active: 600;
      --sidebar-nav-link-border-color--active: #6366f1;
      --sidebar-name-font-size: 1.15rem;
      --sidebar-name-font-weight: 800;
      --sidebar-name-color: #0f172a;
      --link-color: #6366f1;
      --link-color--hover: #4f46e5;
      --heading-color: #0f172a;
      --heading-h1-font-size: 2rem;
      --heading-h1-font-weight: 800;
      --heading-h2-font-size: 1.4rem;
      --heading-h2-font-weight: 700;
      --heading-h2-border-color: #f1f5f9;
      --heading-h3-font-size: 1.05rem;
      --code-font-family: 'SF Mono', Monaco, 'JetBrains Mono', monospace;
      --code-font-size: 0.85em;
      --code-inline-background: #f1f5f9;
      --code-inline-color: #e11d48;
      --code-inline-border-radius: 3px;
      --code-inline-padding: 2px 6px;
      --code-block-border-radius: 8px;
      --code-block-padding: 20px;
      --code-theme-background: #0f172a;
      --code-theme-text: #e2e8f0;
      --blockquote-border-color: #6366f1;
      --blockquote-background: #eef2ff;
      --notice-tip-background: #f0fdf4;
      --notice-tip-border-color: #86efac;
      --notice-important-background: #eff6ff;
      --notice-important-border-color: #93c5fd;
      --table-cell-border-color: #f1f5f9;
      --table-head-background: #f8fafc;
      --navbar-root-color: #0f172a;
      --cover-background-color: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      --cover-heading-color: #ffffff;
      --cover-heading-font-size: 3rem;
      --cover-color: #c7d2fe;
      --cover-button-background: #6366f1;
      --cover-button-color: #ffffff;
    }
    .sidebar-nav > ul > li > a { font-weight: 600; color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
    .sidebar-nav > ul > li > ul > li > a { font-weight: 500; font-size: 14px; text-transform: none; letter-spacing: 0; color: #475569; }
    .sidebar-nav li.active > a { color: #6366f1 !important; font-weight: 600 !important; }
    .markdown-section { max-width: 800px; }
    .markdown-section table { font-size: 14px; }
    .markdown-section table th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; }
    .markdown-section pre > code { font-size: 13px; }
    .app-name-link { font-weight: 800 !important; font-size: 1.15rem !important; }
    .method-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; font-family: var(--code-font-family); margin-right: 4px; }
    .method-badge.get { background: #dbeafe; color: #1d4ed8; }
    .method-badge.post { background: #dcfce7; color: #15803d; }
    .method-badge.delete { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '⭐ Pionts',
      repo: 'https://github.com/mazenalhabeby/pionts_system',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: true,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results',
        depth: 3,
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied!',
      },
      tabs: { persist: true, sync: true },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
