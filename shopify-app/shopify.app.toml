# Pionts Rewards — Shopify App Configuration
# This app provides a customer account UI extension for the Pionts loyalty system.

name = "Pionts Rewards"
client_id = "eb126a1e294ef88782a4ce25a2977753"
application_url = "https://hbc-solution.io/v2"
embedded = false

[access_scopes]
scopes = "read_customers,customer_read_customers,read_orders,write_discounts"

[auth]
redirect_urls = ["https://hbc-solution.io/v2/api/v1/auth/shopify/callback", "https://hbc-solution.io/v2/shopify/auth/callback"]

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "https://hbc-solution.io/v2/shopify/webhooks/orders-create"

[[webhooks.subscriptions]]
topics = ["refunds/create"]
uri = "https://hbc-solution.io/v2/shopify/webhooks/refunds-create"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://hbc-solution.io/v2/shopify/webhooks/app-uninstalled"

[pos]
embedded = false
